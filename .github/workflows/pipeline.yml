
name: Pipeline - Calculadora Científica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verificar versão do Node.js
        run: node --version

      - name: Executar testes
        run: node --test calculations.test.js

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Executar análise SAST
        run: semgrep scan --config auto --error .

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Iniciar aplicação
        run: |
          nohup python3 -m http.server 8080 \
            --bind 0.0.0.0 \
            --directory . > /tmp/server.log 2>&1 &

      - name: Aguardar aplicação iniciar
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Aplicação iniciada com sucesso!"
              exit 0
            fi
            sleep 2
          done

          echo "Erro ao iniciar aplicação!"
          cat /tmp/server.log
          exit 1

      - name: Executar análise DAST - OWASP ZAP
        uses: zaproxy/action-baseline@f5ca774232402c0e196ad638f66542481c0fb5cb
        with:
          target: 'http://localhost:8080'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_scan
